name: Release

# Every push to main checks package.json's version. If no GitHub Release
# exists for it yet, this builds the Windows installer, runs the tests and
# publishes the release (creating tag vX.Y.Z). Installed copies of Clubhouse
# check these releases and update themselves.
#
# To ship an update: bump "version" in package.json and push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Is this version already released?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt 2>/dev/null; then
            if grep -qx 'latest.yml' assets.txt; then
              echo "Release $v already exists; nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A release without latest.yml is a half-finished publish: installed
            # copies can't update from it. Remove it (and its tag) and rebuild.
            echo "Release $v is incomplete; removing it to rebuild."
            gh release delete "$v" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          echo "Building release $v."
          echo "release=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: npm ci

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: npm test

      - name: Typecheck and build
        if: steps.version.outputs.release == 'true'
        run: npm run build

      # GitHub only publishes a release for a tag that already exists.
      - name: Tag this version
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Package and publish
        if: steps.version.outputs.release == 'true'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
